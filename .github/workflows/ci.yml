name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Daily against the latest Claude Code: the mods API is early access and can change between releases.
  schedule:
    - cron: "17 18 * * *" # 03:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Record the Claude Code version
        shell: bash
        run: echo "::notice title=Claude Code (${{ runner.os }})::$(claude --version)"

      - name: Install gsettings and the GNOME schemas
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libglib2.0-bin gsettings-desktop-schemas

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate plugins/turn-duration

      - name: Unit tests
        run: claude plugin test plugins/turn-duration

      - name: The site in docs/ is built from site/
        if: runner.os == 'Linux'
        run: |
          node site/build.mjs
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error title=site out of date::docs/ does not match site/. Run node site/build.mjs and commit the result."
            exit 1
          fi

      - name: The sitemap's lastmod moves with the site's text
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          node .github/ci/site-updated.mjs FETCH_HEAD

      - name: OS clock settings
        env:
          GSETTINGS_BACKEND: keyfile
        run: npx --yes tsx .github/ci/os-clock.ts

      - name: Engine probe (session.start without login)
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          cp plugins/turn-duration/hooks/format.ts plugins/turn-duration/hooks/prefs.ts .github/ci/clock-probe/hooks/
          out=$(claude -p --plugin-dir .github/ci/clock-probe --max-turns 1 "Reply with just: ok" 2>&1 | tail -n 3 | tr '\n' ' ') || true
          if [ -f clock-probe.json ]; then
            echo "::notice title=engine probe (${{ runner.os }})::$(cat clock-probe.json)"
          else
            echo "::warning title=engine probe (${{ runner.os }})::session.start wrote nothing; claude said: $out"
          fi
