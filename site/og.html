<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family={{font}}:wght@400;600&display=block" rel="stylesheet">
<style>
  /* The link-preview image, 1200x630: the site's hero in the language of the page. site/og.mjs draws it. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #FFFFFF; color: #202020; }
  body { font-family: "{{fontName}}", system-ui, sans-serif; padding: 92px 96px 0; }
  .chat {
    display: flex; flex-direction: column; height: 263px; padding: 36px 42px 0 40px;
    background: #FAFAFA; border: 2px solid #E4E4E4; border-radius: 28px;
  }
  .bubble { align-self: flex-end; background: #F0F0F0; border-radius: 22px; padding: 18px 31px; font-size: 33px; line-height: 44px; }
  .answer { font-size: 33px; line-height: 44px; margin-top: 20px; }
  .line { font-size: 28px; line-height: 38px; color: #6F6F6F; font-style: italic; margin-top: 12px; }
  h1 { font-size: 64px; line-height: 80px; font-weight: 600; letter-spacing: -0.01em; margin-top: 46px; }
  .sub { font-size: 30px; line-height: 42px; color: #6F6F6F; margin-top: 14px; }
  html[lang="ko"] .sub { word-break: keep-all; }
</style>
</head>
<body>
  <div class="chat">
    <p class="bubble">{{ask}}</p>
    <p class="answer">{{answer}}</p>
    <p class="line">{{line}}</p>
  </div>
  <h1>TurnDuration for Claude</h1>
  <p class="sub">{{text}}</p>
</body>
</html>
